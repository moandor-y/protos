name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure ASLR entropy for ThreadSanitizer
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run all tests
        run: make test

